version: 2.1

orbs:
  node: circleci/node@7.2.0

jobs:
  # Unfortunately cimg/node doesn't tag its images with major only, you have to specify a minor version.
  # We wouldn't need this job if it did, we could just use node/test with a matrix of node major versions.
  Test:
    description: "Run tests for a specific Node.js version"
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/base:stable
    resource_class: large
    steps:
      - checkout
      # The orb resolves `latest` to the newest tag listed by nvm, which can be a
      # pre-release (e.g. `v27.0.0-alpha.*`) that does not run on this image. Keep
      # the `vlatest` job name (it is a required check) but install the newest
      # stable major explicitly. Bump this when a new Node.js major is released.
      - when:
          condition:
            equal: [latest, << parameters.node-version >>]
          steps:
            - node/install:
                node-version: "26"
      - unless:
          condition:
            equal: [latest, << parameters.node-version >>]
          steps:
            - node/install:
                node-version: << parameters.node-version >>
      # The gateway tests use the @apollo/subgraph devDependency, which declares
      # `engines.node >=22` even though it works fine on older Node versions (the
      # gateway suite passes on Node 18). This repo installs with `engine-strict`
      # (see .npmrc), which would refuse that package on 18 and 20, so relax the
      # check for the install on those versions only. Environment variables
      # override .npmrc, and nothing else in the tree is affected: the published
      # packages' dependencies still install engine-strict on every other job.
      - when:
          condition:
            or:
              - equal: ["18", << parameters.node-version >>]
              - equal: ["20", << parameters.node-version >>]
          steps:
            - run:
                name: Relax engine-strict for the @apollo/subgraph devDependency
                command: echo 'export npm_config_engine_strict=false' >> "$BASH_ENV"
      - node/install-packages
      - run:
          name: Run tests
          command: npm run test:ci
      - run:
          name: Upload coverage
          command: npm run coverage:upload
      - store_test_results:
          path: junit.xml
  Lint:
    description: "Run a lint command using a specific Node.js version"
    parameters:
      script:
        type: string
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - node/install:
          node-version: '24'
      - node/install-packages
      - run:
          name: Compile
          command: npm run compile
      - run:
          name: Run lint
          command: npm run << parameters.script >>

workflows:
  Build:
    jobs:
      - Test:
          name: Test - Node.js v<< matrix.node-version >>
          matrix:
            parameters:
              node-version:
                - "18"
                - "20"
                - "22"
                - "24"
                - "latest"
      - Lint:
          name: Lint - << matrix.script >>
          matrix:
            parameters:
              script:
                - "error-code-doc:check"
                - "codegen:check"
                - "hints-doc:check"
                - "spell:check"
                - "prettier:check"
